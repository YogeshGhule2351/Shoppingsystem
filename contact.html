<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Yogesh through the accessible contact form.">

    <meta name="author"
          content="Yogesh">

    <title>Contact | Yogesh</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="container">

        <h1>Yogesh</h1>

        <nav aria-label="Main Navigation">

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<main>

    <section aria-labelledby="contact-title">

        <div class="container">

            <h2 id="contact-title">Contact Me</h2>

            <p>
                If you would like to contact me, please fill out
                the form below.
            </p>


            <form action="#" method="post">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <p>
            &copy; 2026 Yogesh. All rights reserved.
        </p>

    </div>

</footer>

</body>
</html>
